name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked --git https://github.com/MCbabel/playkit playkit-pack
      - name: index.json is generated, not edited
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if grep -qx index.json <<<"$changed"; then
            echo "index.json is generated, leave it out of the pull request"
            exit 1
          fi
      - run: playkit-pack index . --base-url "https://raw.githubusercontent.com/${{ github.repository }}/main" --out "$RUNNER_TEMP/index.json"
